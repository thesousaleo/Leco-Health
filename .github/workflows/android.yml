name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build web (Vite)
        run: npm run build

      - name: Publicar a versão web (GitHub Pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          node scripts/build-single.mjs
          rm -rf site && mkdir site
          cp dist-single/index.html site/
          cp -r web/. site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Versão web ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Ícone e splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F26B3A' --splashBackgroundColor '#E9E5DF' --splashBackgroundColorDark '#1C1B1A'

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Usar chave de assinatura fixa (permite atualizar o app sem desinstalar)
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          cfg = """android {
              signingConfigs {
                  debug {
                      storeFile file('../../android-signing/leco.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""
          s = s.replace('android {', cfg, 1)
          open(p, 'w').write(s)
          PY
          grep -n -A3 "signingConfigs" android/app/build.gradle

      - name: Ícone monocromático (Android 13+)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android-res/ic_launcher_monochrome.xml android/app/src/main/res/drawable/
          for f in android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml; do
            [ -f "$f" ] || continue
            grep -q monochrome "$f" || sed -i 's#</adaptive-icon>#    <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>\n</adaptive-icon>#' "$f"
            cat "$f"
          done

      - name: Tela infinita e tamanho de texto fixo (MainActivity)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          pkg=$(grep -m1 '^package' "$f")
          { echo "$pkg"; echo; cat <<'JAVA'
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private volatile float insetTop = 0f, insetBottom = 0f;
              private volatile String pendingAction = null;

              public class Insets_ {
                  @JavascriptInterface public String get() { return insetTop + "," + insetBottom; }
                  /** Atalho do ícone que abriu o app (o JS pede e a ação é consumida). */
                  @JavascriptInterface public String takeAction() { String a = pendingAction; pendingAction = null; return a == null ? "" : a; }
                  @JavascriptInterface public void setLight(final boolean light) {
                      runOnUiThread(() -> {
                          WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                          c.setAppearanceLightStatusBars(light);
                          c.setAppearanceLightNavigationBars(light);
                      });
                  }
              }

              /** lecohealth://atalho/agua → "agua" */
              private void readAction(Intent it, boolean live) {
                  if (it == null) return;
                  Uri u = it.getData();
                  if (u == null || !"lecohealth".equals(u.getScheme())) return;
                  String a = u.getLastPathSegment();
                  if (a == null) return;
                  pendingAction = a;
                  if (live && getBridge() != null && getBridge().getWebView() != null) {
                      final WebView wv = getBridge().getWebView();
                      wv.post(() -> wv.evaluateJavascript("window.__lecoAction&&window.__lecoAction()", null));
                  }
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  readAction(intent, true);
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  readAction(getIntent(), false);
                  Window w = getWindow();
                  // Tela infinita: o app desenha por trás da barra de status e da barra de navegação.
                  WindowCompat.setDecorFitsSystemWindows(w, false);
                  w.setStatusBarColor(Color.TRANSPARENT);
                  w.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 29) {
                      w.setStatusBarContrastEnforced(false);
                      w.setNavigationBarContrastEnforced(false);
                  }
                  if (getBridge() == null) return;
                  final WebView wv = getBridge().getWebView();
                  if (wv == null) return;
                  wv.getSettings().setTextZoom(100);
                  wv.addJavascriptInterface(new Insets_(), "LecoInsets");
                  wv.addJavascriptInterface(new LecoBridge(this), "LecoNative");

                  final View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                      float d = getResources().getDisplayMetrics().density;
                      insetTop = bars.top / d;
                      insetBottom = bars.bottom / d;
                      // Teclado aberto: encolhe o app para o campo não ficar escondido.
                      v.setPadding(bars.left, 0, bars.right, ime.bottom > bars.bottom ? ime.bottom : 0);
                      wv.post(() -> wv.evaluateJavascript("window.__setInsets&&window.__setInsets(" + insetTop + "," + insetBottom + ")", null));
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(content);
              }

              @Override
              public void onResume() {
                  super.onResume();
                  View content = findViewById(android.R.id.content);
                  if (content != null) ViewCompat.requestApplyInsets(content);
              }
          }
          JAVA
          } > "$f"
          cat "$f"

      - name: Atalhos do ícone (segurar o ícone do app)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          jpkg=$(grep -m1 '^package' "$f" | sed -E 's/package +([^;]+);/\1/')
          appid=$(grep -oE "appId: *'[^']+'" capacitor.config.ts | sed -E "s/appId: *'([^']+)'/\1/")
          echo "appId=$appid pacote=$jpkg"
          python3 android-res/shortcuts/make.py "$appid" "$jpkg"

      - name: Widget e contagem do descanso (nativo)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          jpkg=$(grep -m1 '^package' "$f" | sed -E 's/package +([^;]+);/\1/')
          appid=$(grep -oE "appId: *'[^']+'" capacitor.config.ts | sed -E "s/appId: *'([^']+)'/\1/")
          python3 android-res/native/make.py "$appid" "$jpkg"

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/LecoHealth-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LecoHealth-apk
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leco Health v1.0.${{ github.run_number }}
          body: |
            APK de instalação para Android.
            Baixe o arquivo `.apk` abaixo no celular e toque para instalar (permita "instalar apps desconhecidos" se o Android pedir).
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
