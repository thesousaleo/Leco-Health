name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build web (Vite)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Ícone e splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F26B3A' --splashBackgroundColor '#E9E5DF' --splashBackgroundColorDark '#1C1B1A'

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/LecoHealth-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LecoHealth-apk
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leco Health v1.0.${{ github.run_number }}
          body: |
            APK de instalação para Android.
            Baixe o arquivo `.apk` abaixo no celular e toque para instalar (permita "instalar apps desconhecidos" se o Android pedir).
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
